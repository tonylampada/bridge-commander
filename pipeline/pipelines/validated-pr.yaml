# ─────────────────────────────────────────────────────────────────────────────
# pipeline: validated-pr   (the seed copy)
#
# This file IS the pipeline's behaviour, and also the whole worker brief for
# both of its stages. Edit here: no code change, no restart.
#
# You are reading one of two things. In the executor's own `pipeline/pipelines/`
# it is a seed, copied into a workspace once by `pipeline/seed.js`. In
# `<workspace>/.bridge-commander/pipelines/` it is the live file — the only
# place a pipeline is ever read from, and yours to edit.
#
# To reuse this rather than fork it, leave it alone and write a new file beside
# it that names it (nested maps merge, lists replace):
#
#   # validated-pr-mine.yaml
#   extends: validated-pr
#   validating:
#     run:
#       - node --test
#
# Then start the card with `--pipeline validated-pr-mine`. Bases resolve by name
# in this same folder — a path is not a name, and will not resolve.
#
# Check it before you spend anything on it:
#   pipeline/run.js <card-id> --workspace <dir> --check
# That validates every key and every {{variable}} and prints the exact prompts
# it would send. An unknown key, a misspelled variable or an unbalanced section
# is refused with the file and the key named — nothing is spawned.
#
# ⚠ THE SHARP EDGE
# `preamble` is not decoration. Some of its lines are the only thing keeping a
# stage agent inside the board's rules: work only in your checkout, never talk
# to the captain, never move the card, never report done to the board yourself.
# They are prose, and prose is what you are editing. Delete "never move the
# card" and you get agents that move cards — and the review column stops
# meaning what it means.
# ─────────────────────────────────────────────────────────────────────────────

name: validated-pr

# Each stage runs in the card's own git worktree (the board provisioned it at
# `card start`). false = both stages run in the project's own checkout, for
# repos that cannot be worktree'd or whose build is too heavy to duplicate.
# Not per-stage: both stages must look at the same tree.
worktree: true

# How many times findings may bounce back to `working` before the card stops
# bouncing and rings the lieutenant instead.
max_rounds: 3

# ── preamble ─────────────────────────────────────────────────────────────────
# Prepended to every stage's prompt, so the rules are written once instead of
# twice and a stage prompt can be about the stage.
preamble: |
  You are one agent inside a pipeline, bound to ONE card, working in an
  isolated git checkout. You implement or you validate — never both. You never
  talk to the captain, and you do not decide what happens next: report, and the
  pipeline routes.

  ## Ground rules

  - Your checkout is `{{worktree}}` (project `{{project.name}}`). FIRST, verify
    your cwd is exactly that and NOT the project clone (`{{project.path}}`); if
    it is the clone, STOP and report it with the reject command.
  - Work only inside your checkout. Never touch the project clone or the
    workspace directly.
  - Signal real milestones (branch created, tests green, PR open) — not chatter:
    `{{bc}} worker signal {{card.id}} "<one line>" --workspace {{workspace}}`
  - Do NOT move the card, and do NOT run `worker done` — that verb belongs to
    the pipeline, and using it would report the whole card finished. You end
    your stage with the command your stage names, and nothing else.

  ## The task

  {{card.task}}

  {{#card.thread}}
  ## Card thread (captain ↔ lieutenant context)

  {{card.thread}}
  {{/card.thread}}

  ## Branch

  The checkout starts on a detached HEAD of the project's default branch.
  Create your task branch first: `git checkout -b {{branch}}` (or
  `git checkout {{branch}}` if a previous round already made it). All commits
  go on that branch.

# ── stage: working ───────────────────────────────────────────────────────────
# The implementer. ONE session, resumed across bounces, so it keeps what the
# last round of findings taught it.
working:
  prompt: |
    ## Your contract for this stage — implement

    STEP ZERO, before anything else: invoke the `ponytail` skill (type
    `/ponytail`). Naming a skill is not invoking it; this step is done when the
    skill has actually loaded.

    Then implement and commit on `{{branch}}`. Do NOT push and do NOT open a
    PR — a separate validation agent does that, and it is the next stage.

    {{#findings}}
    ## Round {{round}} of {{max_rounds}} — a validation round rejected this

    Fix exactly these, then commit again:

    {{findings}}
    {{/findings}}

    When the work is committed, report:

        {{done}} --outcome "<what you changed, in one or two lines>"

# ── stage: validating ────────────────────────────────────────────────────────
# ALWAYS a fresh session — the point is a reader who did not write the code.
# `run` executes first; its output reaches the prompt as {{run.output}}.
# Set the whole stage to `none` for a project that ships straight from working.
validating:
  run:
    # NO -y. `--yes` auto-resolves every gate — including the ask-user
    # findings, with no escalation — and then accepts the result. That is
    # precisely the judgement this stage exists to make, so it must not be
    # spent by a flag. Without it the run blocks at the first gate and prints
    # the finding, which is what the agent below reads and rules on.
    # `push` is skipped too: nothing reaches the real remote before a judged
    # decision. pr/ci are skipped because this stage writes the PR itself.
    - no-mistakes axi run --intent "{{card.title}}" --skip push,pr,ci

  prompt: |
    ## Your contract for this stage — validate

    You did not write this code and you are not here to be agreeable. The
    commits are on `{{branch}}`. The task above is what was asked for. This is
    round {{round}} of at most {{max_rounds}}.

    The local validation run said:

    {{run.output}}

    Read the diff yourself as well — the run is evidence, not a verdict.

    Then answer both of these in writing, before you decide anything. Neither
    is optional, and "the tests pass" is not an answer to either.

    1. FALSIFY THE TESTS. Revert the change itself, keep the new test files,
       and run them. A test that passes without the fix protects nothing. If
       any still pass, that is a finding — say "the test does not fail without
       the fix" and name the test. If the change added no test files, say so
       explicitly: "nothing to falsify — no tests were added", and weigh that.
       Restore the tree before you go on.

    2. NAME WHAT WAS REMOVED. What behaviour does this change take away — a
       capability, a code path, a case that used to work? Answer with the
       behaviour, or with "nothing was removed". Trading a capability away is
       a product decision, not an implementation detail: it reaches a human or
       it does not happen.

    Then decide, and be willing to say no:

    - Something real is wrong → write what is wrong and how to reproduce it
      (not opinions about style) to a file, and reject:

          {{reject}} --findings <file>

      That text goes VERBATIM into the implementer's next round. It is the only
      thing they will have to go on, so write it for someone who cannot ask you
      a question. A test that passed without the fix belongs in that file, named
      — so does a behaviour the change removed that the task did not ask for.
      Both are "something real is wrong".

    - It is good → push the branch and open the PR yourself. YOU author the
      description: invoke the `nobloat-pr-description` skill (type
      `/nobloat-pr-description`) — motivation first, prepare the reviewer, no
      mechanics lecture, the diff already shows the how. If the change removed
      a behaviour and you judged that right, say which one in the description —
      the reviewer is the human it has to reach. Then report:

          {{done}} --outcome "<one line> <full PR URL>"

# ── after the last stage ─────────────────────────────────────────────────────
# The existing flow resumes, untouched: the executor reports and stops, the
# lieutenant verifies and moves the card, and the merge stays the captain's.

# ── variables ────────────────────────────────────────────────────────────────
# Computed per run, never written here:
#   {{card.id}} {{card.title}} {{card.task}} {{card.thread}}
#     card.task = the card body, else the title
#   {{branch}} {{worktree}} {{project.name}} {{project.path}} {{workspace}}
#   {{round}} {{max_rounds}}
#   {{run.output}}   — this stage's `run` output (only where `run` exists)
#   {{findings}}     — the last rejection, empty on the first round
#   {{bc}}           — the board CLI, absolute
#   {{done}} {{reject}} — how THIS stage and round reports; append your own half
#
# `{{#x}}…{{/x}}` drops the block when x is empty.
